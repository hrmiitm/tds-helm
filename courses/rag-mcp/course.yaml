apiVersion: studio.course/v2
kind: Course
metadata:
  id: rag-mcp
  version: "5.0.0"
  title: "RAG Mastery: Architecture, Retrieval & Evaluation"
  badge: "RAG & Vector Search"
  description: "Master modern RAG systems from first principles: BM25 sparse search, Gemini vector embeddings, 3D PCA visualization, sliding window chunking, ChromaDB HNSW indexing, reciprocal rank fusion (RRF), and LLM-as-a-judge evaluation."
  difficulty: intermediate
  estimatedMinutes: 120
runtime:
  profile: rag-cpu
  image: rag-studio:4.2.0
  architectures: [linux/amd64, linux/arm64]
  tools: [vscode, jupyter, preview]
  optionalTools: [browser]
  network: egress
  resources:
    cpuMilli: 2000
    memoryMiB: 3072
  startupSeconds: 120
  previewPorts: [8000]
content:
  tasks: tasks.json
  slides: slides/index.html
  workspace: workspace
modules:
  - id: mod_bm25
    title: "Module 1: BM25 Keyword Search & Term Saturation"
    taskIds: [Q01, Q02, Q03, Q04, Q05]
    slideIds: [slide_01, slide_02]
    defaultTool: jupyter
  - id: mod_embeddings
    title: "Module 2: Vector Embeddings & 3D PCA Visualization"
    taskIds: [Q06, Q07, Q08, Q09, Q10]
    slideIds: [slide_01, slide_03]
    defaultTool: jupyter
  - id: mod_chunking
    title: "Module 3: Document Chunking, Overlap & L2 Distance Search"
    taskIds: [Q11, Q12, Q13, Q14, Q15]
    slideIds: [slide_01, slide_03]
    defaultTool: jupyter
  - id: mod_chromadb_hybrid
    title: "Module 4: ChromaDB & Hybrid Search (Dense + BM25 + RRF + LLM Judge)"
    taskIds: [Q16, Q17, Q18, Q19, Q20]
    slideIds: [slide_01, slide_02, slide_03]
    defaultTool: jupyter
