apiVersion: studio.course/v2
kind: Course
metadata:
  id: rag-mcp
  version: 4.2.0
  title: "Foundations of RAG: Embeddings & Vector Search"
  badge: "RAG & Vector Search"
  description: "From Markdown chunks to similarity metrics, PCA, ChromaDB, HNSW, IVF, and multimodal embeddings. 43 Reveal.js slides, 6 Jupyter labs, and 48 MCQ/NAT tasks."
  difficulty: intermediate
  estimatedMinutes: 180
runtime:
  profile: rag-cpu
  image: rag-studio:4.2.0
  architectures: [linux/amd64, linux/arm64]
  tools: [vscode, jupyter, preview]
  optionalTools: [browser]
  network: offline
  resources:
    cpuMilli: 2000
    memoryMiB: 3072
  startupSeconds: 120
  previewPorts: [8000]
content:
  tasks: tasks.json
  slides: slides/index.html
  workspace: workspace
