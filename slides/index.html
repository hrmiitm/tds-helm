<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RAG Studio — Slide Presentation (slide.pdf)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #090d16;
      --card-bg: #111827;
      --border: #1f2937;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --accent-blue: #38bdf8;
      --accent-emerald: #10b981;
      --accent-rose: #f43f5e;
      --header-h: 48px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg);
      color: var(--text-main);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      user-select: none;
    }

    /* Top Sticky Control Header */
    .slide-deck-header {
      height: var(--header-h);
      background: rgba(17, 24, 39, 0.96);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 100;
      flex-shrink: 0;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-title {
      font-weight: 700;
      font-size: 13.5px;
      letter-spacing: 0.5px;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .brand-title span {
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .badge-pill {
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 9999px;
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.35);
      color: var(--accent-blue);
      font-weight: 600;
      text-decoration: none;
    }

    .header-center {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--text-muted);
      max-width: 45%;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .slide-current-title {
      font-weight: 600;
      color: #e2e8f0;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: #1f2937;
      color: #f3f4f6;
      border: 1px solid #374151;
      border-radius: 6px;
      padding: 5px 11px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .nav-btn:hover:not(:disabled) {
      background: #374151;
      border-color: #4b5563;
      color: #fff;
    }

    .nav-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .slide-counter {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: #94a3b8;
      min-width: 86px;
      text-align: center;
      font-weight: 600;
    }

    .laser-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: #1f2937;
      color: #e2e8f0;
      border: 1px solid #374151;
      border-radius: 6px;
      padding: 5px 10px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .laser-btn.active {
      background: rgba(244, 63, 94, 0.2);
      border-color: var(--accent-rose);
      color: #fda4af;
    }

    .laser-dot-icon {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-rose);
      display: inline-block;
    }

    .close-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(244, 63, 94, 0.15);
      border: 1px solid rgba(244, 63, 94, 0.4);
      color: #fda4af;
      border-radius: 6px;
      padding: 5px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .close-btn:hover {
      background: rgba(244, 63, 94, 0.25);
    }

    .close-btn.hidden {
      display: none;
    }

    /* Presentation Viewport */
    .viewport {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background: radial-gradient(circle at center, #111827 0%, #090d16 100%);
      padding: 16px;
      overflow: hidden;
    }

    /* Slide Stage */
    .slide-stage {
      width: 100%;
      height: 100%;
      max-width: 1600px;
      max-height: 900px;
      aspect-ratio: 16 / 9;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.08);
      background: #000;
      overflow: hidden;
    }

    .slide-item {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.25s ease-in-out;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    .slide-item.active {
      opacity: 1;
      visibility: visible;
      z-index: 10;
    }

    .slide-item img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      pointer-events: none;
    }

    /* Embedded PDF Frame View */
    .pdf-frame-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #1e293b;
      display: none;
      z-index: 20;
    }

    .pdf-frame-container.active {
      display: block;
    }

    .pdf-frame-container iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    /* Laser Pointer Simulation */
    #laser-pointer {
      position: fixed;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 50, 80, 1) 0%, rgba(255, 0, 40, 0.7) 40%, rgba(255, 0, 0, 0) 80%);
      box-shadow: 0 0 12px 3px rgba(255, 20, 50, 0.9);
      pointer-events: none;
      transform: translate(-50%, -50%);
      z-index: 9999;
      display: none;
      mix-blend-mode: screen;
    }

    /* Bottom Quick Action Bar */
    .quick-bar {
      position: absolute;
      bottom: 24px;
      background: rgba(17, 24, 39, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 30px;
      padding: 6px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 30;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }

    .quick-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #4b5563;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .quick-dot.active {
      background: var(--accent-blue);
      transform: scale(1.3);
      box-shadow: 0 0 8px rgba(56, 189, 248, 0.6);
    }

    .quick-btn {
      background: transparent;
      border: 0;
      color: #94a3b8;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 2px 6px;
      border-radius: 4px;
      transition: color 0.15s;
    }

    .quick-btn:hover {
      color: #fff;
    }

    .quick-btn a {
      color: inherit;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <!-- Top Sticky Presentation Controls -->
  <header class="slide-deck-header" id="slide-header">
    <div class="header-left">
      <div class="brand-title">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#38bdf8" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
        <span>RAG Studio</span>
      </div>
      <span class="badge-pill">Slide Deck (PDF)</span>
    </div>

    <div class="header-center">
      <span class="slide-current-title" id="slide-title">1. RAG Architecture: Ingestion & Retrieval Phases</span>
    </div>

    <div class="header-right">
      <button class="nav-btn" id="btn-prev" title="Previous Slide (← / Up / PgUp)" disabled>
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg>
        <span>Prev</span>
      </button>

      <span class="slide-counter" id="slide-counter">Slide 1 of 3</span>

      <button class="nav-btn" id="btn-next" title="Next Slide (→ / Down / Space / PgDn)">
        <span>Next</span>
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>
      </button>

      <button class="laser-btn" id="btn-laser" title="Toggle Laser Pointer">
        <span class="laser-dot-icon"></span>
        <span>Laser</span>
      </button>

      <button class="nav-btn" id="btn-toggle-view" title="Toggle Raw PDF / Slide Mode">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
        <span id="btn-toggle-view-text">PDF View</span>
      </button>

      <button class="close-btn hidden" id="btn-close" title="Close Focus View (Esc)">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        <span>Close (Esc)</span>
      </button>
    </div>
  </header>

  <!-- Presentation Viewport -->
  <main class="viewport" id="viewport">
    <div class="slide-stage" id="slide-stage">
      <!-- Slide 1 -->
      <div class="slide-item active" id="slide-1" data-index="0" data-title="1. RAG Architecture: Ingestion & Retrieval Phases">
        <img src="images/slide-1.png" alt="Slide 1: Ingestion and Retrieval Architecture">
      </div>

      <!-- Slide 2 -->
      <div class="slide-item" id="slide-2" data-index="1" data-title="2. Keyword Search: TF-IDF & BM25 Foundations">
        <img src="images/slide-2.png" alt="Slide 2: Keyword Search TF-IDF and BM25">
      </div>

      <!-- Slide 3 -->
      <div class="slide-item" id="slide-3" data-index="2" data-title="3. Vector Databases: Structured vs Semantic Search">
        <img src="images/slide-3.png" alt="Slide 3: Need for Vector Databases">
      </div>

      <!-- Raw PDF Embed Frame -->
      <div class="pdf-frame-container" id="pdf-container">
        <iframe src="slide.pdf#toolbar=1&navpanes=1" id="pdf-frame" title="slide.pdf"></iframe>
      </div>
    </div>

    <!-- Laser Pointer Simulator -->
    <div id="laser-pointer"></div>

    <!-- Quick Navigation Dots & Download -->
    <div class="quick-bar">
      <div class="quick-dot active" data-target="0" title="Slide 1: Ingestion & Retrieval Architecture"></div>
      <div class="quick-dot" data-target="1" title="Slide 2: Keyword Search (BM25 & TF-IDF)"></div>
      <div class="quick-dot" data-target="2" title="Slide 3: Vector Databases & Semantic Search"></div>
      <span style="width: 1px; height: 14px; background: rgba(255,255,255,0.2);"></span>
      <button class="quick-btn" title="Download slide.pdf">
        <a href="slide.pdf" download="slide.pdf" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
          <span>PDF</span>
        </a>
      </button>
    </div>
  </main>

  <script>
  (() => {
    'use strict';

    const SLIDE_TITLES = [
      '1. RAG Architecture: Ingestion & Retrieval Phases',
      '2. Keyword Search: TF-IDF & BM25 Foundations',
      '3. Vector Databases: Structured vs Semantic Search'
    ];
    const TOTAL_SLIDES = 3;
    let currentIndex = 0;
    let isLaserActive = false;
    let isPdfMode = false;

    // Elements
    const domCounter = document.getElementById('slide-counter');
    const domTitle = document.getElementById('slide-title');
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');
    const btnLaser = document.getElementById('btn-laser');
    const btnClose = document.getElementById('btn-close');
    const btnToggleView = document.getElementById('btn-toggle-view');
    const btnToggleViewText = document.getElementById('btn-toggle-view-text');
    const laserPointer = document.getElementById('laser-pointer');
    const pdfContainer = document.getElementById('pdf-container');
    const slides = [
      document.getElementById('slide-1'),
      document.getElementById('slide-2'),
      document.getElementById('slide-3')
    ];
    const dots = document.querySelectorAll('.quick-dot');

    function goToSlide(index) {
      if (index < 0 || index >= TOTAL_SLIDES) return;
      currentIndex = index;

      slides.forEach((slide, idx) => {
        if (slide) slide.classList.toggle('active', idx === currentIndex);
      });

      dots.forEach((dot, idx) => {
        dot.classList.toggle('active', idx === currentIndex);
      });

      if (domCounter) domCounter.textContent = `Slide ${currentIndex + 1} of ${TOTAL_SLIDES}`;
      if (domTitle) domTitle.textContent = SLIDE_TITLES[currentIndex];
      if (btnPrev) btnPrev.disabled = (currentIndex === 0);
      if (btnNext) btnNext.disabled = (currentIndex === TOTAL_SLIDES - 1);

      // Post update to parent if embedded
      try {
        window.parent?.postMessage({
          type: 'SLIDE_CHANGED',
          index: currentIndex,
          total: TOTAL_SLIDES,
          title: SLIDE_TITLES[currentIndex]
        }, '*');
      } catch (_) {}
    }

    function prevSlide() {
      if (currentIndex > 0) goToSlide(currentIndex - 1);
    }

    function nextSlide() {
      if (currentIndex < TOTAL_SLIDES - 1) goToSlide(currentIndex + 1);
    }

    btnPrev.addEventListener('click', prevSlide);
    btnNext.addEventListener('click', nextSlide);

    dots.forEach(dot => {
      dot.addEventListener('click', () => {
        const target = parseInt(dot.getAttribute('data-target'), 10);
        if (!isNaN(target)) goToSlide(target);
      });
    });

    // Toggle Raw PDF vs Slides
    btnToggleView.addEventListener('click', () => {
      isPdfMode = !isPdfMode;
      pdfContainer.classList.toggle('active', isPdfMode);
      btnToggleViewText.textContent = isPdfMode ? 'Slide View' : 'PDF View';
    });

    // Laser Pointer
    btnLaser.addEventListener('click', () => {
      isLaserActive = !isLaserActive;
      btnLaser.classList.toggle('active', isLaserActive);
      laserPointer.style.display = isLaserActive ? 'block' : 'none';
    });

    window.addEventListener('mousemove', (e) => {
      if (isLaserActive) {
        laserPointer.style.left = e.clientX + 'px';
        laserPointer.style.top = e.clientY + 'px';
      }
    });

    // Modal Close
    if (btnClose) {
      btnClose.addEventListener('click', (e) => {
        e.preventDefault();
        window.parent?.postMessage({ type: 'CLOSE_SLIDES' }, '*');
        window.parent?.postMessage({ type: 'EXIT_FOCUS' }, '*');
      });
    }

    // Modal Detection
    const urlParams = new URLSearchParams(window.location.search);
    const isModal = urlParams.get('modal') === 'true' || window.location.hash.includes('modal');
    if (isModal && btnClose) {
      btnClose.classList.remove('hidden');
    }

    // Keyboard Shortcuts
    window.addEventListener('keydown', (e) => {
      if (e.target.matches('input, textarea')) return;
      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown' || e.key === 'l' || e.key === 'ArrowDown') {
        e.preventDefault();
        nextSlide();
      } else if (e.key === 'ArrowLeft' || e.key === 'PageUp' || e.key === 'h' || e.key === 'ArrowUp') {
        e.preventDefault();
        prevSlide();
      } else if (e.key === 'Home') {
        e.preventDefault();
        goToSlide(0);
      } else if (e.key === 'End') {
        e.preventDefault();
        goToSlide(TOTAL_SLIDES - 1);
      } else if (e.key === 'Escape') {
        window.parent?.postMessage({ type: 'CLOSE_SLIDES' }, '*');
        window.parent?.postMessage({ type: 'EXIT_FOCUS' }, '*');
      }
    });

    // Parent Message Coordination
    window.addEventListener('message', (event) => {
      if (!event.data || typeof event.data !== 'object') return;
      const msg = event.data;
      if (msg.type === 'reveal-navigate') {
        if (msg.direction === 'prev') prevSlide();
        else if (msg.direction === 'next') nextSlide();
      } else if (msg.type === 'GO_TO_SLIDE') {
        if (typeof msg.index === 'number') goToSlide(msg.index);
      } else if (msg.type === 'SLIDES_MODAL_STATE') {
        if (btnClose) {
          if (msg.isOpen) btnClose.classList.remove('hidden');
          else btnClose.classList.add('hidden');
        }
      }
    });

    // Initial state
    goToSlide(0);
  })();
  </script>
</body>
</html>
