<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Excalidraw Whiteboard</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #121212;
      color: #ffffff;
    }
    body.light-theme {
      background-color: #ffffff;
      color: #121212;
    }
    .excalidraw-container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .excalidraw-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background-color: transparent;
    }
    .fallback-banner {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 100;
      display: flex;
      gap: 8px;
    }
    .banner-btn {
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #f8fafc;
      font-size: 13px;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      backdrop-filter: blur(4px);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }
    .banner-btn:hover {
      background: #38bdf8;
      color: #0b0f19;
      border-color: #38bdf8;
    }
  </style>
</head>
<body class="dark-theme">
  <div class="excalidraw-container">
    <div class="fallback-banner">
      <a class="banner-btn" href="https://excalidraw.com" target="_blank" rel="noopener noreferrer">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
        Open Excalidraw
      </a>
    </div>
    <!-- Official Open-Source Excalidraw Web Application -->
    <iframe class="excalidraw-frame" id="excalidraw-iframe" src="https://excalidraw.com" allow="clipboard-read; clipboard-write" title="Excalidraw Workspace"></iframe>
  </div>

  <script>
    // Listen for theme changes from parent RAG Studio app
    window.addEventListener('message', (event) => {
      if (event.data && event.data.type === 'SET_THEME') {
        const theme = event.data.theme;
        document.body.className = theme + '-theme';
      }
    });

    // Initial theme sync
    try {
      const savedTheme = localStorage.getItem('rag_studio_theme');
      if (savedTheme) {
        document.body.className = savedTheme + '-theme';
      }
    } catch(e) {}
  </script>
</body>
</html>
